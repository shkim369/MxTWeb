version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Nano12#$
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - mxtweb-network

  mxtweb:
    image: mxtweb:latest
    container_name: mxtweb
    environment:
      # LocalDB 연결을 Docker SQL Server로 재정의
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=aspnet-MxTWeb;User Id=sa;Password=Nano12#$;TrustServerCertificate=true;MultipleActiveResultSets=true;
      - ConnectionStrings__MxTWebContext=Server=sqlserver,1433;Database=MxTWebContext;User Id=sa;Password=Nano12#$;TrustServerCertificate=true;MultipleActiveResultSets=true;
      - ConnectionStrings__DockerConnection=Server=sqlserver,1433;Database=MxTWebContext;User Id=sa;Password=Nano12#$;TrustServerCertificate=true;MultipleActiveResultSets=true;
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - mxtweb-network
    volumes:
      # NAS의 실제 경로와 컨테이너 경로 매핑
      - /docker/blazor-uploads:/app/uploads
    restart: unless-stopped

networks:
  mxtweb-network:
    driver: bridge

volumes:
  sqlserver_data: