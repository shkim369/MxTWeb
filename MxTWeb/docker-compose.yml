services:
  mxtweb:
    image: mxtweb:latest
    container_name: mxtweb
    environment:
      # 연결 문자열·API 키·관리자 비밀번호는 같은 폴더의 .env 파일에서 주입.
      - ConnectionStrings__LoginConnection=${LOGIN_CONNECTION:?LOGIN_CONNECTION env var is required}
      - ConnectionStrings__WebContextConnection=${WEBCONTEXT_CONNECTION:?WEBCONTEXT_CONNECTION env var is required}
      - ApiKey=${API_KEY:?API_KEY env var is required}
      - AdminBootstrap__Email=${ADMIN_EMAIL:-}
      - AdminBootstrap__Password=${ADMIN_PASSWORD:-}
    ports:
      # 호스트포트:컨테이너포트
      - "49156:8080"
      - "49155:8081"
    volumes:
      # NAS 실제 경로 : 컨테이너 내부 경로 (appsettings.json의 UploadPath)
      - /volume1/docker/web/web-uploads:/docker/web/web-uploads
    restart: unless-stopped
